<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="stylesheet" href="{{root}}style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%238f3b26' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%238f3b26'/%3E%3C/svg%3E">
<script>
/* Theme memory — the only JavaScript on this site. No analytics, no trackers. */
(function () {
  try {
    var t = localStorage.getItem("darshan-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
</head>
<body>
<button class="theme-toggle" aria-label="Toggle light and dark" onclick="
  (function () {
    var d = document.documentElement;
    var cur = d.getAttribute('data-theme');
    if (!cur) { cur = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    var next = cur === 'dark' ? 'light' : 'dark';
    d.setAttribute('data-theme', next);
    try { localStorage.setItem('darshan-theme', next); } catch (e) {}
  })();
">◐</button>

<header class="masthead">
  <h1 class="wordmark"><a href="{{root}}index.html">DARSHAN</a></h1>
  <p class="tagline">A signal of clear seeing in an age of information overload</p>
  <nav>
    <a href="{{root}}index.html">Articles</a>
    <a href="{{root}}about.html">About</a>
  </nav>
</header>

<main>
{{content}}
</main>

<footer>
  <p>Darshan · seeing clearly after the feed</p>
  <p>No feed. No analytics. No trackers. Finite editions, read at your own pace.</p>
  <p style="opacity:.7">Darshan v0.0.0.1 · a beginning, built to grow</p>
</footer>
</body>
</html>
